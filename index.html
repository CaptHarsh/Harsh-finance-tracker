<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harsh Finance</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<h1>💰 Harsh Finance Tracker</h1>

<div class="grid">
<div class="card"><h3>RBL</h3><p id="rblBalance"></p></div>
<div class="card"><h3>Kotak</h3><p id="kotakBalance"></p></div>
<div class="card"><h3>Credit Card</h3><p id="ccBalance"></p></div>
<div class="card"><h3>Net Worth</h3><p id="netWorth"></p></div>
</div>

<select id="transactionType">
<option>Expense</option>
<option>Income</option>
</select>

<select id="category"></select>

<input id="amount" type="number" placeholder="Amount">

<select id="account">
<option>RBL</option>
<option>Kotak</option>
<option>Credit Card</option>
</select>

<button onclick="addTransaction()">Add Transaction</button>

<div id="transactionsList"></div>

<script src="app.js"></script>
</body></html>
