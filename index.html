<!DOCTYPE html><html><head>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Harsh Finance V4</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head><body>
<h1>💰 Harsh Finance</h1>

<div class="hero">
<div class="card"><h3>Net Worth</h3><span id="net"></span></div>
<div class="card"><h3>Safe Today</h3><span id="safe"></span></div>
<div class="card"><h3>Daily Left</h3><span id="daily"></span></div>
<div class="card"><h3>Weekly Left</h3><span id="weekly"></span></div>
</div>

<div class="card">
<select id="monthFilter"></select>
</div>

<div class="quick">
<button onclick="quick('Food')">🍔 Food</button>
<button onclick="quick('Petrol')">⛽ Petrol</button>
<button onclick="quick('Shopping')">🛍 Shopping</button>
<button onclick="quick('Travel')">🚕 Travel</button>
</div>

<div class="card">
<select id="type">
<option>Expense</option><option>Income</option><option>Transfer</option>
</select>
<select id="category"></select>
<input id="amount" type="number" placeholder="Amount">
<select id="account"><option>RBL</option><option>Kotak</option><option>Credit Card</option></select>
<button onclick="addTx()">Save</button>
</div>

<div class="card">
<h3>Recent Transactions</h3>
<div id="list"></div>
</div>

<script src="app.js"></script>
</body></html>
