<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harsh Finance Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head><body>
<h1>💰 Harsh Finance Tracker</h1>

<div class="grid">
<div class="card"><h3>💰 RBL</h3><div id="rbl"></div></div>
<div class="card"><h3>🏦 Kotak</h3><div id="kotak"></div></div>
<div class="card"><h3>💳 Credit Card</h3><div id="cc"></div></div>
<div class="card"><h3>📈 Net Worth</h3><div id="net"></div></div>
<div class="card"><h3>🟢 Safe To Spend</h3><div id="safe"></div></div>
<div class="card"><h3>💵 Reimbursement</h3><div id="reimb"></div></div>
</div>

<select id="monthFilter"></select>

<div class="quick">
<button onclick="quick('Food')">🍔 Food</button>
<button onclick="quick('Petrol')">⛽ Petrol</button>
<button onclick="quick('Shopping')">🛍 Shopping</button>
<button onclick="quick('Travel')">🚕 Travel</button>
</div>

<div class="card">
<select id="type"><option>Expense</option><option>Income</option></select>
<select id="category"></select>
<select id="account"><option>RBL</option><option>Kotak</option><option>Credit Card</option></select>
<input id="amount" type="number" placeholder="Amount">
<button onclick="addTx()">Save</button>
</div>

<div id="transactions"></div>

<script src="app.js"></script>
</body></html>
