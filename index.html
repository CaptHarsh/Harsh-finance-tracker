<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harsh Finance</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<h2>💰 Harsh Finance</h2>

<div class="mini-grid">
<div class="mini">💰 <span id="rbl"></span></div>
<div class="mini">🏦 <span id="kotak"></span></div>
<div class="mini">💳 <span id="cc"></span></div>
<div class="mini">📈 <span id="netWorth"></span></div>
</div>

<div class="mini-grid">
<div class="mini">🟢 <span id="safeSpend"></span></div>
<div class="mini">💵 <span id="reimb"></span></div>
<div class="mini">📅 <span id="dailyBudget"></span></div>
<div class="mini">📆 <span id="weeklyBudget"></span></div>
<div class="mini">💳 <span id="ccUtil"></span></div>
<div class="mini">🔮 <span id="forecast"></span></div>
</div>

<div class="card">
🎯 Goal
<div class="bar"><div id="goalBar" class="fill"></div></div>
<div id="goalText"></div>
</div>

<select id="type"><option>Expense</option><option>Income</option><option>Transfer</option></select>
<select id="category"></select>
<input id="amount" type="number" placeholder="Amount">
<select id="account"><option>RBL</option><option>Kotak</option><option>Credit Card</option></select>
<button onclick="addTx()">➕ Add</button>

<select id="monthFilter"><option value="">📅 All Months</option></select>

<div id="list"></div>
<script src="app.js"></script>
</body></html>
