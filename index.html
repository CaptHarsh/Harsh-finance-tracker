<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harsh Finance</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<h1>💰 Harsh Finance</h1>

<div class="card"><h3>Net Worth</h3><h2 id="netWorth"></h2></div>
<div class="card"><h3>Projected Month End Savings</h3><h2 id="forecast"></h2></div>
<div class="card"><h3>Safe To Spend</h3><h2 id="safeSpend"></h2></div>
<div class="card"><h3>Daily Budget Remaining</h3><h2 id="dailyBudget"></h2></div>
<div class="card"><h3>Weekly Budget Remaining</h3><h2 id="weeklyBudget"></h2></div>
<div class="card"><h3>Credit Card Utilization</h3><h2 id="ccUtil"></h2></div>

<div class="grid">
<div class="card"><h3>RBL</h3><p id="rbl"></p></div>
<div class="card"><h3>Kotak</h3><p id="kotak"></p></div>
<div class="card"><h3>Credit Card</h3><p id="cc"></p></div>
<div class="card"><h3>Reimbursement</h3><p id="reimb"></p></div>
</div>

<select id="type"><option>Expense</option><option>Income</option><option>Transfer</option></select>
<select id="category"></select>
<input id="amount" type="number" placeholder="Amount">
<select id="account"><option>RBL</option><option>Kotak</option><option>Credit Card</option></select>
<button onclick="addTx()">Add Transaction</button>

<select id="monthFilter"><option value="">All Months</option></select>
<div id="list"></div>

<script src="app.js"></script>
</body></html>
