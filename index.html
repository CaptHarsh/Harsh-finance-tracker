<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Harsh Finance Tracker</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="dashboardPage" class="page active">

<header>
<h1>💰 Finance Dashboard</h1>
</header>

<div class="dashboard-grid">

<div class="card">
<h3>💰 RBL</h3>
<p id="rblBalance">₹0</p>
</div>

<div class="card">
<h3>🏦 Kotak</h3>
<p id="kotakBalance">₹0</p>
</div>

<div class="card">
<h3>💳 Credit Card</h3>
<p id="ccBalance">₹0</p>
</div>

<div class="card">
<h3>📈 Net Worth</h3>
<p id="netWorth">₹0</p>
</div>

<div class="card">
<h3>🎯 Savings Goal</h3>
<p id="goalProgress">0%</p>
</div>

<div class="card">
<h3>🟢 Safe To Spend</h3>
<p id="safeSpend">₹0</p>
</div>

<div class="card">
<h3>📅 Daily Budget</h3>
<p id="dailyBudget">₹0</p>
</div>

<div class="card">
<h3>📆 Weekly Budget</h3>
<p id="weeklyBudget">₹0</p>
</div>

<div class="card">
<h3>💵 Reimbursement</h3>
<p id="reimbursementAmount">₹8800</p>
</div>

</div>

</div>

<div id="transactionsPage" class="page">

<h2>Transactions</h2>

<select id="monthFilter"></select>

<div class="quick-buttons">

<button onclick="quickCategory('Food')">🍔 Food</button>

<button onclick="quickCategory('Petrol')">⛽ Petrol</button>

<button onclick="quickCategory('Shopping')">🛍 Shopping</button>

<button onclick="quickCategory('Travel')">🚕 Travel</button>

</div>

<select id="transactionType">
<option>Expense</option>
<option>Income</option>
<option>Transfer</option>
</select>

<select id="category"></select>

<input id="amount" type="number" placeholder="Amount">

<select id="account">
<option>RBL</option>
<option>Kotak</option>
<option>Credit Card</option>
</select>

<button onclick="addTransaction()">
Add Transaction
</button>

<div id="transactionsList"></div>

</div>

<div id="settingsPage" class="page">

<h2>⚙️ Settings</h2>

<label>Monthly Salary</label>
<input id="salaryInput" type="number">

<label>Savings Goal</label>
<input id="goalInput" type="number">

<label>Credit Card Limit</label>
<input id="ccLimitInput" type="number">

<label>Reimbursement</label>
<input id="reimbursementInput" type="number">

<label>RBL Balance</label>
<input id="rblInput" type="number">

<label>Kotak Balance</label>
<input id="kotakInput" type="number">

<label>Credit Card Outstanding</label>
<input id="ccInput" type="number">

<button onclick="saveSettings()">
Save Settings
</button>

</div>

<nav class="bottom-nav">

<button onclick="showPage('dashboardPage')">
🏠
</button>

<button onclick="showPage('transactionsPage')">
💸
</button>

<button onclick="showPage('settingsPage')">
⚙️
</button>

</nav>

<script src="app.js"></script>

</body>
</html>
